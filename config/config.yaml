# TradeLens configuration. Transformation code must read from here — no hardcoding.

project: tradelens

# Which universe of symbols to pull (keep small while developing).
symbols:
  - AAPL
  - MSFT
  - TSLA
  - AMZN
  - NVDA

# Date range for historical pull (yfinance).
date_range:
  start: "2023-01-01"
  end: "2024-01-01"
  interval: "1d"        # use "1m"/"5m" for finer granularity (limited history)

# Storage roots. {env}=local uses local paths; {env}=aws uses s3a:// (from .env).
paths:
  local:
    raw: "data/raw"
    bronze: "data/lake/bronze"
    silver: "data/lake/silver"
    gold: "data/lake/gold"
  aws:
    raw: "s3a://${TRADELENS_RAW_BUCKET}/raw"
    bronze: "s3a://${TRADELENS_CURATED_BUCKET}/bronze"
    silver: "s3a://${TRADELENS_CURATED_BUCKET}/silver"
    gold: "s3a://${TRADELENS_CURATED_BUCKET}/gold"

# Synthetic order-event generator settings.
synthetic:
  orders_per_symbol_per_day: 2000
  seed: 42
  inject:
    spoofing_rate: 0.02       # fraction of orders that are spoof patterns
    wash_trade_rate: 0.01
    layering_rate: 0.01
  accounts: 50                # number of distinct trading accounts

# Analytics windows.
analytics:
  vwap_window: 20             # rows
  volatility_window: 20       # rows
  daily_rollup: true

# Surveillance thresholds.
surveillance:
  spoof_cancel_ms: 500        # place->cancel within this = suspicious
  rapid_order_window_sec: 60
  rapid_order_count: 20       # > this many orders in the window = flag
  risk_score_alert_threshold: 0.7

# Skew handling.
skew:
  salt_buckets: 8             # salt high-volume symbols into N sub-keys

# Data quality.
quality:
  fail_on_error: true
  outlier_stddev_threshold: 3   # flag a day's return as an outlier beyond N stddevs

# Static securities reference (name/sector/status) — seed for the SCD2
# securities_master dimension. In production this would come from a proper
# reference-data feed; kept small and static here since ticker metadata isn't
# the point of the demo. Keep in sync with `symbols` above.
securities_reference:
  AAPL: {name: "Apple Inc.", sector: "Technology", status: "active"}
  MSFT: {name: "Microsoft Corporation", sector: "Technology", status: "active"}
  TSLA: {name: "Tesla, Inc.", sector: "Consumer Cyclical", status: "active"}
  AMZN: {name: "Amazon.com, Inc.", sector: "Consumer Cyclical", status: "active"}
  NVDA: {name: "NVIDIA Corporation", sector: "Technology", status: "active"}

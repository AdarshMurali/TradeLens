# TradeLens configuration. Transformation code must read from here — no hardcoding.

project: tradelens

# Which universe of symbols to pull. 50 symbols = the "10x" demo-scale
# checkpoint (up from the 5-symbol local-dev set), chosen to give ~50M
# order events / ~1.3GB raw while keeping the date range unchanged — see
# docs/PROJECT_PLAN.md Phase 6. Deliberately excludes very recent IPOs
# (e.g. ARM, listed Sep 2023) so every symbol has the full date_range's
# worth of trading days; a partial-history symbol would break that
# assumption and skew per-symbol row counts.
symbols:
  - AAPL
  - MSFT
  - TSLA
  - AMZN
  - NVDA
  - GOOGL
  - META
  - AVGO
  - AMD
  - ORCL
  - CRM
  - ADBE
  - INTC
  - QCOM
  - TXN
  - MU
  - ASML
  - TSM
  - ADI
  - PLTR
  - SNOW
  - CRWD
  - NET
  - PANW
  - ANET
  - MRVL
  - LRCX
  - KLAC
  - AMAT
  - DELL
  - IBM
  - CSCO
  - NFLX
  - DIS
  - JPM
  - BAC
  - V
  - MA
  - WMT
  - HD
  - PG
  - KO
  - PEP
  - XOM
  - CVX
  - JNJ
  - UNH
  - PFE
  - COST
  - MCD

# Date range for historical pull (yfinance).
date_range:
  start: "2023-01-01"
  end: "2024-01-01"
  interval: "1d"        # use "1m"/"5m" for finer granularity (limited history)

# Storage roots. {env}=local uses local paths; {env}=aws uses s3a:// (from .env).
paths:
  local:
    raw: "data/raw"
    bronze: "data/lake/bronze"
    silver: "data/lake/silver"
    gold: "data/lake/gold"
  aws:
    raw: "s3a://${TRADELENS_RAW_BUCKET}/raw"
    bronze: "s3a://${TRADELENS_CURATED_BUCKET}/bronze"
    silver: "s3a://${TRADELENS_CURATED_BUCKET}/silver"
    gold: "s3a://${TRADELENS_CURATED_BUCKET}/gold"

# Synthetic order-event generator settings.
synthetic:
  orders_per_symbol_per_day: 2000
  seed: 42
  inject:
    spoofing_rate: 0.02       # fraction of orders that are spoof patterns
    wash_trade_rate: 0.01
    layering_rate: 0.01
  accounts: 50                # number of distinct trading accounts

# Analytics windows.
analytics:
  vwap_window: 20             # rows
  volatility_window: 20       # rows
  daily_rollup: true

# Surveillance thresholds.
surveillance:
  spoof_cancel_ms: 500          # place->cancel within this = suspicious
  spoof_min_quantity: 2000      # AND quantity at least this large (normal orders are 100-1000)
  wash_trade_window_sec: 10     # same account/symbol/price BUY+SELL within this bucket = wash trade
  # A layering episode (see ingestion/generate_order_events.py) places 4-6
  # orders then cancels them all within roughly 1-8 seconds -> 8-12 NEW/CANCEL
  # events for one account+symbol. rapid_order_counts_salted buckets events
  # into fixed windows (tumbling, not sliding/session), so a window much
  # narrower than an episode's span risks splitting one burst across a bucket
  # boundary and undercounting both halves below the threshold — empirically,
  # a 10s window misses ~40% of layering episodes this way, vs ~8% at 45s.
  # Background order traffic for any single (account, symbol) pair is sparse
  # (~2000 orders/day spread over 50 accounts and a ~6.5h session), so a
  # window this wide still cleanly separates bursts from normal activity —
  # no real bid/ask depth data to tune against, but the margin is large.
  rapid_order_window_sec: 45
  rapid_order_count: 6          # > this many NEW/CANCEL events in the window = flag
  risk_score_alert_threshold: 0.7

# Skew handling.
skew:
  salt_buckets: 8             # salt high-volume symbols into N sub-keys

# Data quality.
quality:
  fail_on_error: true
  outlier_stddev_threshold: 3   # flag a day's return as an outlier beyond N stddevs

# Static securities reference (name/sector/status) — seed for the SCD2
# securities_master dimension. In production this would come from a proper
# reference-data feed; kept small and static here since ticker metadata isn't
# the point of the demo. Keep in sync with `symbols` above.
securities_reference:
